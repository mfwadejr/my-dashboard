# Homebase + go2rtc in ONE file. In ZimaOS: App Store -> "+" (Custom Install) -> paste/import this file.
name: homebase

services:
  homebase:
    image: ghcr.io/mfwadejr/my-dashboard:latest
    container_name: homebase
    restart: unless-stopped
    ports:
      - "3000:3000"
      # Camera share links only. Point your reverse proxy at this one, never at 3000.
      - "3001:3001"
    environment:
      # go2rtc runs on the host network (see below), so Homebase reaches it through the host.
      GO2RTC_URL: http://host.docker.internal:1984
      # Optional: pre-set the admin password instead of choosing it in the browser on first visit.
      # ADMIN_PASSWORD: change-me-please
      # ADMIN_USERNAME: admin
      # Set to true when a reverse proxy sits in front, so the log and limits see the real visitor address.
      # TRUST_PROXY: "true"
      # Optional: your own encryption key for stored API keys / camera URLs (otherwise one is generated in /data).
      # HOMEBASE_SECRET_KEY: a-long-random-string
      # Locked out of two-factor sign-in with no recovery codes? Set this to the username, start once, then remove it.
      # HOMEBASE_RESET_2FA: admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /DATA/AppData/homebase/data:/data
      # Optional, for Docker container monitors: lets Homebase ask Docker whether a container is running.
      # This gives the container control over Docker on this machine, so only turn it on if you trust everything that can sign in.
      # - /var/run/docker.sock:/var/run/docker.sock
    # With the line above, also give the container permission to use the socket (find the number with: stat -c %g /var/run/docker.sock):
    # group_add:
    #   - "999"
    depends_on:
      - go2rtc
    labels:
      icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homarr.png
    x-casaos:
      envs:
        - container: GO2RTC_URL
          description:
            en_us: Where Homebase reaches go2rtc (the camera relay).
        - container: TRUST_PROXY
          description:
            en_us: Set to true when a reverse proxy sits in front, so the log sees the real visitor address.
        - container: ADMIN_PASSWORD
          description:
            en_us: Optional. Pre-set the admin password instead of choosing it on first visit.
      ports:
        - container: "3000"
          description:
            en_us: Dashboard (keep off the internet).
        - container: "3001"
          description:
            en_us: Camera share links only (the port a reverse proxy should point at).
      volumes:
        - container: /data
          description:
            en_us: Homebase database, saved icons, backups and encryption key.

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: homebase-go2rtc
    restart: unless-stopped
    # Host networking lets go2rtc reach cameras on your LAN and use WebRTC. Its web UI (port 1984)
    # has no password, so keep this port off the internet; Homebase proxies only what viewers need.
    network_mode: host
    volumes:
      - /DATA/AppData/homebase/go2rtc:/config
    x-casaos:
      volumes:
        - container: /config
          description:
            en_us: go2rtc settings.

x-casaos:
  architectures:
    - amd64
    - arm64
  main: homebase
  author: Marvin Wade
  developer: Marvin Wade
  category: Utilities
  icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homarr.png
  title:
    en_us: Homebase
  tagline:
    en_us: A self-hosted dashboard for your apps, cameras and servers
  description:
    en_us: Homebase shows Sonarr, Radarr, SABnzbd, Unraid, UniFi, cameras and more on one customizable dashboard, with backups, sharing and sign-in built in. Includes go2rtc for camera video.
  index: /
  port_map: "3000"
  scheme: http
