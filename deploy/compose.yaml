# Generic Docker host version: docker compose up -d
name: homebase

services:
  homebase:
    image: ghcr.io/mfwadejr/my-dashboard:latest
    container_name: homebase
    restart: unless-stopped
    ports:
      - "3000:3000"
      # Camera share links only. Point your reverse proxy at this one, never at 3000.
      - "3001:3001"
    environment:
      # go2rtc runs on the host network (see below), so Homebase reaches it through the host.
      GO2RTC_URL: http://host.docker.internal:1984
      # Optional: pre-set the admin password instead of choosing it in the browser on first visit.
      # ADMIN_PASSWORD: change-me-please
      # ADMIN_USERNAME: admin
      # Set to true when a reverse proxy sits in front, so the log and limits see the real visitor address.
      # TRUST_PROXY: "true"
      # Optional: your own encryption key for stored API keys / camera URLs (otherwise one is generated in /data).
      # HOMEBASE_SECRET_KEY: a-long-random-string
      # Locked out of two-factor sign-in with no recovery codes? Set this to the username, start once, then remove it.
      # HOMEBASE_RESET_2FA: admin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./homebase/data:/data
      # Optional, for Docker container monitors: lets Homebase ask Docker whether a container is running.
      # This gives the container control over Docker on this machine, so only turn it on if you trust everything that can sign in.
      # - /var/run/docker.sock:/var/run/docker.sock
    # With the line above, also give the container permission to use the socket (find the number with: stat -c %g /var/run/docker.sock):
    # group_add:
    #   - "999"
    depends_on:
      - go2rtc
    labels:
      icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/homarr.png

  go2rtc:
    image: alexxit/go2rtc:latest
    container_name: homebase-go2rtc
    restart: unless-stopped
    # Host networking lets go2rtc reach cameras on your LAN and use WebRTC. Its web UI (port 1984)
    # has no password, so keep this port off the internet; Homebase proxies only what viewers need.
    network_mode: host
    volumes:
      - ./homebase/go2rtc:/config
